- name: Provision Bot
  hosts: localhost
  gather_facts: False
  tasks:
    - name: Provision an EC2 instance with a public IP address
      amazon.aws.ec2_instance:
        name: TripleA Bot
        aws_profile: default
        key_name: triplea
        vpc_subnet_id: subnet-b25c3afe
        instance_type: t4g.micro
        security_group: TripleA
        volumes:
          - device_name: "/dev/sda1"
            ebs:
              volume_size: 15 # The size in GB
              volume_type: "gp3"
              delete_on_termination: true
              iops: 3000
        network:
          assign_public_ip: true
        image_id: ami-05b580e994a808c42
        region: us-east-2
      register: result

    - name: Add all instance public IPs to host group
      add_host: hostname={{ item.public_ip_address }} groups=ec2hosts
      loop: "{{ result.instances }}"

